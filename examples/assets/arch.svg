<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Consolas, 'Cascadia Mono', monospace">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5eead4"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f0abfc"/>
    </marker>
  </defs>
  <rect width="900" height="300" fill="#0b1020"/>
  <g stroke="#1e293b" stroke-width="1">
    <path d="M0 60 H900 M0 120 H900 M0 180 H900 M0 240 H900"/>
    <path d="M150 0 V300 M300 0 V300 M450 0 V300 M600 0 V300 M750 0 V300"/>
  </g>

  <text x="24" y="34" fill="#e2e8f0" font-size="15" font-weight="bold">showmeWithHTML · 数据流</text>
  <text x="24" y="52" fill="#64748b" font-size="11">同一个地址，两种安全档位</text>

  <!-- agent -->
  <rect x="30" y="90" width="150" height="56" rx="8" fill="#111c33" stroke="#5eead4" stroke-width="1.5"/>
  <text x="105" y="114" fill="#5eead4" font-size="12" text-anchor="middle">agent</text>
  <text x="105" y="132" fill="#7c8aa5" font-size="10" text-anchor="middle">write + show_html</text>

  <!-- workspace -->
  <rect x="250" y="76" width="180" height="84" rx="8" fill="#111c33" stroke="#334155" stroke-width="1.5"/>
  <text x="340" y="102" fill="#cbd5e1" font-size="11" text-anchor="middle">工作区</text>
  <text x="340" y="122" fill="#94a3b8" font-size="10" text-anchor="middle">.dsh/showme/review.html</text>
  <text x="340" y="140" fill="#94a3b8" font-size="10" text-anchor="middle">assets/arch.svg</text>

  <!-- route -->
  <rect x="500" y="76" width="200" height="84" rx="8" fill="#111c33" stroke="#f0abfc" stroke-width="1.5"/>
  <text x="600" y="100" fill="#f0abfc" font-size="11" text-anchor="middle">镜像读路由（宿主）</text>
  <text x="600" y="122" fill="#94a3b8" font-size="9.5" text-anchor="middle">/api/showme/raw/&lt;sid&gt;/&lt;路径&gt;</text>
  <text x="600" y="140" fill="#64748b" font-size="9.5" text-anchor="middle">realpath 围栏 · 白名单 · CSP</text>

  <!-- two tiers -->
  <rect x="756" y="52" width="124" height="60" rx="8" fill="#0f2a24" stroke="#5eead4" stroke-width="1.5"/>
  <text x="818" y="76" fill="#5eead4" font-size="11" text-anchor="middle">卡片 iframe</text>
  <text x="818" y="94" fill="#7c8aa5" font-size="9.5" text-anchor="middle">安全模式</text>

  <rect x="756" y="128" width="124" height="60" rx="8" fill="#2a1030" stroke="#f0abfc" stroke-width="1.5"/>
  <text x="818" y="152" fill="#f0abfc" font-size="11" text-anchor="middle">浏览器新标签</text>
  <text x="818" y="170" fill="#7c8aa5" font-size="9.5" text-anchor="middle">功能完整</text>

  <!-- feedback -->
  <rect x="250" y="212" width="450" height="60" rx="8" fill="#181228" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="475" y="236" fill="#a78bfa" font-size="11" text-anchor="middle">反馈回路（两条，都不经过服务器）</text>
  <text x="475" y="256" fill="#8b93a7" font-size="10" text-anchor="middle">postMessage → 卡片「填入输入框」　·　页面内可选中文本 → 直接粘回对话</text>

  <g fill="none" stroke="#5eead4" stroke-width="1.5" marker-end="url(#a)">
    <path d="M180 118 H246"/>
  </g>
  <g fill="none" stroke="#f0abfc" stroke-width="1.5" marker-end="url(#b)">
    <path d="M430 118 H496"/>
    <path d="M700 100 H752"/>
    <path d="M700 152 H752"/>
  </g>
  <g fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b)">
    <path d="M818 188 V242 H704"/>
  </g>
  <path d="M105 146 V242 H246" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b)"/>
  <text x="118" y="236" fill="#8b93a7" font-size="9.5">用户回执</text>
</svg>
